<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOCTURNE — Y2K Streetwear</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #12141d;
      --text: #f0f3f9;
      --muted: #8892b0;
      --silver: #e2e8f0;
      --chrome-gradient: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 50%, #cbd5e1 100%);
      --chrome-border: linear-gradient(135deg, #ffffff 0%, #475569 50%, #94a3b8 100%);
      --accent-glow: rgba(226, 232, 240, 0.15);
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.05) 0%, transparent 70%),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 4px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 16px 12px 80px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* HEADER */
    .header {
      text-align: center;
      padding: 20px 12px 16px 12px;
      background: rgba(18, 20, 29, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--chrome-gradient);
    }

    .brand-subtitle {
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .brand-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 6px;
      background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .brand-tagline {
      font-size: 11px;
      color: #cbd5e1;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* SEARCH & FILTER */
    .search-box {
      width: 100%;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      letter-spacing: 1px;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cat-btn.active, .cat-btn:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    /* PRODUCT GRID - STRICT 2 COLUMNS */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      position: relative;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #1a1d28;
      position: relative;
      overflow: hidden;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .product-card:hover .product-img {
      transform: scale(1.05);
    }

    .card-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      gap: 8px;
    }

    .product-title {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
      color: #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .price {
      font-size: 14px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .shop-btn {
      width: 100%;
      padding: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      color: #000000;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-align: center;
      border-radius: 6px;
      text-transform: uppercase;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover .shop-btn {
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    /* FOOTER */
    .footer {
      text-align: center;
      padding: 24px 0;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

      { id: 30, title: "NOCTURNE Edition Boxy Item #30", price: "₱150", category: "PANTS", image: "https://i.postimg.cc/WzxrD669/IMG-8227.jpg", url: "https://s.lazada.com.ph/s.Z7ohJb?c=d" },
      { id: 31, title: "NOCTURNE Edition Boxy Item #31", price: "₱150", category: "CROP TEES", image: "https://i.postimg.cc/8cxWFBBH/IMG-8228.jpg", url: "https://s.lazada.com.ph/s.Z7ohrp?c=d" }
    ];

    let activeCat = "ALL";
    let searchQuery = "";

    function renderProducts() {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = "";

      const filtered = products.filter(p => {
        const matchesCat = activeCat === "ALL" || p.category === activeCat;
        const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 40px 0; color: #8892b0; font-size: 12px; letter-spacing: 1px;">NO ITEMS FOUND</div>`;
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement("a");
        card.className = "product-card";
        card.href = p.url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";

        card.innerHTML = `
          <div class="img-wrapper">
            <img class="product-img" src="${p.image}" alt="${p.title}" loading="lazy">
          </div>
          <div class="card-info">
            <div class="product-title">${p.title}</div>
            <div class="price-row">
              <span class="price">${p.price}</span>
            </div>
            <div class="shop-btn">SHOP NOW</div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function filterCategory(cat) {
      activeCat = cat;
      document.querySelectorAll(".cat-btn").forEach(btn => {
        btn.classList.toggle("active", btn.textContent === cat);
      });
      renderProducts();
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderProducts();
    });

    // Initial Render
    renderProducts();
  </script>

</html>
